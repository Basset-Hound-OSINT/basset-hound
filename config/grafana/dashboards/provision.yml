# Grafana Dashboard Provisioning Configuration
apiVersion: 1

providers:
  - name: "Basset Hound Dashboards"
    orgId: 1
    folder: "Basset Hound"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
